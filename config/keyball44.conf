CONFIG_BT_PERIPHERAL_PREF_MAX_INT=9
# Slave latency: how many connection events the radio may skip to save power. The
# worst-case silent gap is (latency + 1) * interval, so 16 at an 11.25ms interval
# permits 191ms of nothing, and ZMK never renegotiates it (there is no
# bt_conn_le_param_update in ble.c) — so if the pointer ever does stall in a way
# that tracks this bound, this is the knob.
#
# It was set to 0 on the strength of a frame-differenced screen recording, which
# turned out to be contaminated by dropped recorder frames; the real cause of the
# stalls was a ball sticking in its bearings. 0 keeps the radio awake at every
# connection event and costs real battery, so it is back at 16 until measurement
# justifies otherwise.
#
# Measure with tools/cursorgaps.swift rather than a screen recording — it samples
# the cursor directly at 1kHz. At latency 0 with a clean ball the figures were
# 102 updates/sec, median gap 8.1ms, 96% inside 16ms. If 16 matches that, the
# battery saving is free. Intermediate values and the gap each permits at
# 11.25ms: 2 -> 34ms, 4 -> 56ms, 8 -> 101ms.
CONFIG_BT_PERIPHERAL_PREF_LATENCY=16
CONFIG_BT_BUF_ACL_TX_COUNT=8
CONFIG_BT_BUF_EVT_RX_COUNT=10
CONFIG_BT_L2CAP_TX_BUF_COUNT=32


# set transmission power to max
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_BEHAVIORS_QUEUE_SIZE=512

CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_EXT_POWER=y
