CONFIG_BT_PERIPHERAL_PREF_MAX_INT=9
# Slave latency: how many connection events the radio may skip. It exists to let
# a keyboard sleep through idle intervals, and 16 is fine for keys — but this
# board is also the pointer, and a pointer has something to say every few
# milliseconds. The worst-case silent gap is (latency + 1) * interval, so 16 at
# an 11.25ms interval allows 191ms of nothing, which matches the ~192ms cursor
# freezes measured while circling the ball. ZMK does no dynamic renegotiation
# (there is no bt_conn_le_param_update call in ble.c), so this is static and
# will not tighten itself when the pointer becomes active.
#
# 0 keeps the radio present at every connection event. That costs battery on the
# right half, which is the one talking to the host. Intermediate values, with the
# silent gap they permit at 11.25ms: 2 -> 34ms, 4 -> 56ms, 8 -> 101ms.
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_BUF_ACL_TX_COUNT=8
CONFIG_BT_BUF_EVT_RX_COUNT=10
CONFIG_BT_L2CAP_TX_BUF_COUNT=32


# set transmission power to max
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_BEHAVIORS_QUEUE_SIZE=512

CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_EXT_POWER=y
