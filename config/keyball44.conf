CONFIG_BT_PERIPHERAL_PREF_MAX_INT=9
# Slave latency: how many connection events the radio may skip to save power. The
# worst-case silent gap is (latency + 1) * interval, so 16 at an 11.25ms interval
# permits 191ms of nothing, and ZMK never renegotiates it (there is no
# bt_conn_le_param_update in ble.c) — so if the pointer ever does stall in a way
# that tracks this bound, this is the knob.
#
# It was set to 0 on the strength of a frame-differenced screen recording, which
# turned out to be contaminated by dropped recorder frames; the real cause of the
# stalls was a ball sticking in its bearings. 0 keeps the radio awake at every
# connection event and costs real battery, so it is back at 16 until measurement
# justifies otherwise.
#
# Measured with tools/cursorgaps.swift, which samples the cursor directly at 1kHz
# rather than frame-differencing a recording. At 16 with a freely spinning ball:
# 115 updates/sec, median gap 8.2ms, p90 8.9ms, p99 15.5ms, 99% inside 16ms —
# better on every figure than 0 managed while the ball was sticking. Latency 0
# buys nothing here. Intermediate values and the gap each permits at 11.25ms:
# 2 -> 34ms, 4 -> 56ms, 8 -> 101ms.
CONFIG_BT_PERIPHERAL_PREF_LATENCY=16
CONFIG_BT_BUF_ACL_TX_COUNT=8
CONFIG_BT_BUF_EVT_RX_COUNT=10
CONFIG_BT_L2CAP_TX_BUF_COUNT=32


# set transmission power to max
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_BEHAVIORS_QUEUE_SIZE=512

CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_EXT_POWER=y

# Deep sleep after 15 minutes idle, on both halves — the peripheral goes idle at
# the same moment the central does, and left awake it drains its cell for nothing.
# USB power suppresses it, so a half on the cable never sleeps.
#
# Waking is a reset: deep sleep is nRF52 System OFF, which has no other exit, so
# the keypress that wakes a half is swallowed and the halves take a couple of
# seconds to re-pair. This only works at all because kscan0 declares
# wakeup-source (see keyball44.dtsi) — without it the matrix pins are disconnected
# before power-off and nothing but the power switch revives the half.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000
