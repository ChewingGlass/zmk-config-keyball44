CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_ZMK_MOUSE=y
CONFIG_ZMK_EXT_POWER=y
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

CONFIG_PMW3610=y
CONFIG_PM_DEVICE=y
CONFIG_PMW3610_PM=y

# --- Pointer speed and resolution ------------------------------------------
#
# High CPI here, pointer speed turned down in macOS. This is the standard
# high-DPI arrangement and it is the only one that makes slow movement smooth.
#
# Granularity is what causes jerk at low speed. One count is the smallest step
# the pointer can take, so at 400 CPI (0.064mm per count) a slow roll moves the
# cursor a whole pixel at a time at irregular intervals. More CPI means finer
# steps: 1600 CPI is 0.016mm per count, four times smoother.
#
# Scaling back down must not happen in firmware. Both available knobs are integer
# divides — CPI_DIVIDOR discards the remainder outright, and zip_xy_scaler keeps
# it but still emits whole pixels, so any ratio below 1 makes some reports emit
# zero and reintroduces exactly the stepping this is meant to remove. macOS
# accumulates fractionally through its own acceleration curve, so reducing
# tracking speed there costs nothing.
#
# CPI does NOT affect report rate — one report per poll regardless — so raising
# it does not add BLE traffic or bring back the pointer lag that 250Hz caused.
# Only the magnitude inside each report grows.
#
# This pairs with macOS acceleration DISABLED:
#   defaults write -g com.apple.mouse.scaling -1     (then log out and back in)
# With the curve off, the mapping is linear — cursor movement is proportional to
# ball movement — so CPI alone sets speed and every count is worth the same.
# Leaving acceleration on made each update swing 0.4x-2x the local average step
# size even at a steady circling speed, which is the jerk: the curve reacts to
# small speed variations and amplifies them. The tracking-speed slider does
# nothing once scaling is -1, so speed lives here.
#
# CPI_DIVIDOR must stay 1. Despite the name it is not a sensor register — it is
# an integer divide applied to every motion report (pmw3610.c: raw_x =
# TOINT16(...) / dividor). Above 1 it floors small deltas to zero and kills slow
# tracking outright.
CONFIG_PMW3610_CPI=800
CONFIG_PMW3610_CPI_DIVIDOR=1
CONFIG_PMW3610_ORIENTATION_180=y
CONFIG_PMW3610_SNIPE_CPI=200
CONFIG_PMW3610_SNIPE_CPI_DIVIDOR=1

# Scroll ignores both the dividor and the scaler, accumulating raw sensor counts
# until SCROLL_TICK is reached, so it tracks CPI directly and must move whenever
# CPI does. In physical terms:
#
#   ball travel per scroll click = SCROLL_TICK * 25.4 / CPI  (mm)
#
# 60 at 800 CPI is 1.9mm per click. Matching the old feel would have been 44
# (0.7mm), which was too twitchy — a third of a fingertip roll fired a click.
# Raise this for slower scrolling, lower it for faster.
CONFIG_PMW3610_SCROLL_TICK=60
CONFIG_PMW3610_INVERT_SCROLL_X=y
CONFIG_PMW3610_INVERT_SCROLL_Y=n
CONFIG_PMW3610_SMART_ALGORITHM=y

# Acceleration is off, and macOS's own curve is left enabled, so this behaves
# like any other pointer on the machine. It was briefly turned on to buy reach
# for long movements while base gain was low — but that whole precision-versus-
# reach problem was an artefact of a sticking ball, not of the settings, and it
# should not be reintroduced without evidence.
#
# To enable: ALGORITHM=1, then out = x + x*x/divider with divider =
# 22 - 2*sensitivity. Reports of one count or less bypass it, so it cannot
# coarsen slow movement. Only worth doing with macOS acceleration disabled —
# stacking two curves is what made sensitivity 5 feel wild. Never exceed 10:
# at 11 the divider is 0 and the driver divides by it.
CONFIG_PMW3610_ACCELERATION_ALGORITHM=0
CONFIG_PMW3610_ACCELERATION_SENSITIVITY=5

# --- Power-down ladder ------------------------------------------------------
#
# The sensor steps RUN -> REST1 -> REST2 -> REST3 while idle, sampling less often
# at each step. Sampling IS the wake mechanism — there is no separate low-power
# motion detector — so each state's sample interval is also its worst-case wake
# latency, and movement slow enough to finish between two samples is never seen.
# Deep idle and instant wake are therefore not available together.
#
#   RUN    ->  3.3s idle  -> REST1
#   REST1     20ms/sample, 9.6s   -> REST2   (wake feels instant mid-use)
#   REST2     50ms/sample, ~2min  -> REST3   (wake still imperceptible)
#   REST3    150ms/sample          (deep idle; vs a 500ms hardware default)
#
# Weighted for battery: the fast state is short-lived, while the deep states,
# where the sensor actually spends idle time, sample far less often than REST1
# yet still beat the hardware defaults by 3-5x.
#
# Setting REST2/REST3 explicitly matters — the driver guards those register
# writes with #if <value> >= 10, so leaving them blank silently keeps the
# hardware defaults of roughly 100ms and 500ms. Bounds the driver enforces
# (set_downshift_time / set_sample_time):
#   sample times          10..2550 ms
#   REST1 downshift       16 * REST1_SAMPLE .. 255 * 16 * REST1_SAMPLE
#   REST2 downshift      128 * REST2_SAMPLE .. 255 * 128 * REST2_SAMPLE
# An out-of-range value is rejected at init and the register keeps its default,
# so a bad number fails silently. Keep these consistent when editing.
CONFIG_PMW3610_RUN_DOWNSHIFT_TIME_MS=3264
CONFIG_PMW3610_REST1_SAMPLE_TIME_MS=20
CONFIG_PMW3610_REST1_DOWNSHIFT_TIME_MS=9600
CONFIG_PMW3610_REST2_SAMPLE_TIME_MS=50
CONFIG_PMW3610_REST2_DOWNSHIFT_TIME_MS=128000
CONFIG_PMW3610_REST3_SAMPLE_TIME_MS=150
# FORCE_AWAKE pins RUN mode permanently, at a real cost to battery on this half.
#CONFIG_PMW3610_FORCE_AWAKE=y

# --- Report rate ------------------------------------------------------------
#
# The option names mislead: 250 and 125_SW both drive the sensor at 250Hz
# (register 0x0D), and 125_SW merely discards every other report and folds it
# into the next, which is where its reputation for latency comes from. Only plain
# 125 slows the sensor itself (register 0x00).
#
# This half is the split central, so trackball reports reach the host in one hop
# — but at the negotiated 7.5-11.25ms connection interval that link carries only
# ~90-130 events/sec and cannot drain 250 reports/sec. The backlog shows up as
# pointer lag that grows the longer you keep moving. Use 125 wireless; 250 is
# fine with this half on USB.
CONFIG_PMW3610_POLLING_RATE_125=y

CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

# Both of these are inert while automouse-layer is <0> in the overlay — the
# driver compiles the auto-mouse layer out entirely with #if AUTOMOUSE_LAYER > 0.
# Clicks are dedicated keys on the base layer instead. Kept for the day the
# auto-mouse layer is wanted back: the timeout is measured from the last motion
# report, not the first, and the threshold is how much movement it takes to arm.
CONFIG_PMW3610_AUTOMOUSE_TIMEOUT_MS=600
CONFIG_PMW3610_MOVEMENT_THRESHOLD=5
