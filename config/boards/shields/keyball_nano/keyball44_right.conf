CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_ZMK_MOUSE=y
CONFIG_ZMK_EXT_POWER=y
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

CONFIG_PMW3610=y
CONFIG_PM_DEVICE=y
CONFIG_PMW3610_PM=y
# CPI_DIVIDOR is an integer divide on every motion report (pmw3610.c: raw_x =
# TOINT16(...) / dividor), NOT a sensor register. Anything above 1 truncates:
# at 1200 CPI a slow roll yields 1-3 counts per report and 3/4 == 0, so slow
# movement is discarded outright and only faster rolls get through. Keep the
# dividor at 1 and set the speed with CPI alone, which the sensor does in
# hardware without dropping counts. Raise/lower CPI in steps of 200.
CONFIG_PMW3610_CPI=400
CONFIG_PMW3610_CPI_DIVIDOR=1
CONFIG_PMW3610_ORIENTATION_180=y
CONFIG_PMW3610_SNIPE_CPI=200
CONFIG_PMW3610_SNIPE_CPI_DIVIDOR=1
# Scroll mode ignores the dividor and accumulates raw counts until SCROLL_TICK
# is reached, so this has to fall with CPI or scrolling gets 3x slower: the old
# pairing was 32 ticks at 1200 CPI.
CONFIG_PMW3610_SCROLL_TICK=11
CONFIG_PMW3610_INVERT_SCROLL_X=y
CONFIG_PMW3610_INVERT_SCROLL_Y=n
CONFIG_PMW3610_SMART_ALGORITHM=y

# Quadratic (QMK-style) pointer acceleration: output = x + x*x/divider, where
# divider = 22 - 2*sensitivity. Reports of 1 count or less are passed through
# untouched, so this buys reach on fast flicks without coarsening slow, precise
# movement — which is the whole point of running a low base CPI.
# The curve steepens fast, so this wants to stay near the bottom of the range:
# sensitivity 1 -> divider 20 turns a 10-count report into 15 and a 20-count
# into 40, where sensitivity 5 made those 18 and 53 and read as jumpy.
# Set ACCELERATION_ALGORITHM=0 to remove acceleration outright.
# DO NOT exceed 10. Kconfig permits up to 100, but sensitivity 11 makes the
# divider 0 and the driver divides by it.
CONFIG_PMW3610_ACCELERATION_ALGORITHM=0
CONFIG_PMW3610_ACCELERATION_SENSITIVITY=1
# Power-down ladder. The sensor drops RUN -> REST1 -> REST2 -> REST3, sampling
# less often at each step, and a movement slow enough to finish between two
# samples is never seen at all — which is why missed nudges are intermittent and
# depend on how long the ball sat still.
#
# Leaving the REST2/REST3 knobs unset is the trap: the driver guards them with
# #if <value> >= 10, so blank means the registers keep their hardware defaults of
# roughly 100ms and 500ms between samples. Half a second between samples loses
# slow movement outright. They are set explicitly here.
#
# Bounds enforced by the driver (set_downshift_time / set_sample_time):
#   sample times          10..2550 ms
#   REST1 downshift       16 * REST1_SAMPLE .. 255 * 16 * REST1_SAMPLE
#   REST2 downshift      128 * REST2_SAMPLE .. 255 * 128 * REST2_SAMPLE
# An out-of-range value is rejected at init and the register keeps its default,
# so the failure is silent — keep these consistent when editing.
CONFIG_PMW3610_RUN_DOWNSHIFT_TIME_MS=3264
CONFIG_PMW3610_REST1_SAMPLE_TIME_MS=20
CONFIG_PMW3610_REST1_DOWNSHIFT_TIME_MS=81600
CONFIG_PMW3610_REST2_SAMPLE_TIME_MS=40
CONFIG_PMW3610_REST2_DOWNSHIFT_TIME_MS=600000
CONFIG_PMW3610_REST3_SAMPLE_TIME_MS=100
# FORCE_AWAKE pins the sensor in RUN mode. It is the fix if movement is still
# missed after an idle spell, at a real cost to battery on this half.
#CONFIG_PMW3610_FORCE_AWAKE=y
# Three options, and the names are misleading. 250 and 125_SW both run the sensor
# at 250Hz (register 0x0D); 125_SW then throws away every other report and sums it
# into the next, which is where its extra latency comes from. Only plain 125 slows
# the sensor itself (register 0x00).
# 250 is smoothest on a wired link, but every report crosses two BLE hops here
# (right half -> left half -> host), and at a 7.5-11.25ms connection interval the
# radio cannot drain 250 reports/sec, so the backlog shows up as growing pointer
# lag during movement. 125 halves the traffic without 125_SW's report pairing.
CONFIG_PMW3610_POLLING_RATE_125=y

CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n
# How long U/I/J/K stay mouse clicks after the ball stops moving. The timer is
# restarted by every qualifying report, so this is measured from the last
# movement, not the first. The dactyl used 400; 600 leaves more room to move the
# ball and then click. Cost of raising it: an ordinary j/k typed within the
# window after touching the ball comes out as a click instead.
CONFIG_PMW3610_AUTOMOUSE_TIMEOUT_MS=600
# Movement needed before the ball flips on the MOUSE auto-layer. At 0 the
# faintest brush against the ball turns U/I/J/K into clicks for the timeout
# above, which bites while typing. 5 is the driver default; raise it if the
# layer still triggers by accident.
CONFIG_PMW3610_MOVEMENT_THRESHOLD=5
