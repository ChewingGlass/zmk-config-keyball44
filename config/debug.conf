# Diagnostic overlay for the right half. Applied only by `./build.sh debug`,
# never by a normal build.
#
# Purpose: decide where trackball motion is being lost, rather than inferring it
# from cursor behaviour. Three outcomes are distinguishable in the log:
#
#   1. Nothing logged while the ball moves  -> the sensor reported no motion.
#      Optical or mechanical: lens, ball surface, bearings, ball-to-lens gap.
#   2. "Motion burst failed on SPI ..."     -> SPI reads are failing. Electrical.
#   3. "scaled N with 1/1 to N" lines flow  -> the sensor and driver are fine and
#      motion is being lost after the input pipeline. A firmware problem.
#
# Logging goes over USB CDC ACM, the same endpoint ZMK Studio uses, so this build
# drops the studio snippet. The cdc-acm-uart node lives in config/debug.overlay;
# CONFIG_ZMK_USB_LOGGING cannot be set without it, because USB_CDC_ACM depends on
# DT_HAS_ZEPHYR_CDC_ACM_UART_ENABLED.
# Studio will not work on this firmware; reflash the normal one when finished.
CONFIG_ZMK_USB_LOGGING=y

# The PMW3610 driver's own module: SPI failures, init, CPI/downshift confirmation.
CONFIG_PMW3610_LOG_LEVEL_DBG=y

# The zmk module covers the input listener and processors. The scaler logs every
# X and Y event reaching the listener, which is the "did motion arrive" signal.
CONFIG_ZMK_LOG_LEVEL_DBG=y

# Deferred logging with a generous buffer: at 125 reports/sec this produces a few
# hundred lines a second, and synchronous logging would stall the input path and
# distort the very timing being measured.
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=16384
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=2048
